# docker compose up  ->  dashboard on http://localhost:8994
services:
  dashboard:
    build: .
    ports:
      - "8994:8994"
    environment:
      # The dashboard runs on the heuristic labeler, which needs no key. The recorded
      # Sarvam responses in fixtures/ cover the --llm path at no cost.
      AGENTTRACE_OFFLINE: "0"
    # Uncomment to iterate on the source without rebuilding:
    # volumes:
    #   - .:/app:ro
